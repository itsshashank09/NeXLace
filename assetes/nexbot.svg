<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#1a56db"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6da6ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="platformGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1a56db" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Platform / hover disc glow -->
  <ellipse cx="100" cy="195" rx="55" ry="8" fill="url(#platformGrad)">
    <animate attributeName="ry" values="8;10;8" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Antenna stick -->
  <line x1="100" y1="30" x2="100" y2="54" stroke="#93c5fd" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Antenna ball (glowing) -->
  <circle cx="100" cy="25" r="7" fill="#60a5fa" filter="url(#glow)">
    <animate attributeName="r" values="7;9;7" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="25" r="4" fill="white" opacity="0.5"/>

  <!-- Head (main) -->
  <g filter="url(#softShadow)">
    <rect x="48" y="52" width="104" height="80" rx="32" fill="url(#bodyGrad)"/>
  </g>

  <!-- Head shine -->
  <rect x="48" y="52" width="104" height="40" rx="32" fill="url(#shineGrad)" opacity="0.4"/>

  <!-- Face plate -->
  <rect x="60" y="64" width="80" height="54" rx="22" fill="url(#faceGrad)" opacity="0.9"/>

  <!-- Ears -->
  <rect x="34" y="76" width="18" height="28" rx="9" fill="url(#bodyGrad)"/>
  <rect x="148" y="76" width="18" height="28" rx="9" fill="url(#bodyGrad)"/>
  <rect x="36" y="78" width="14" height="14" rx="7" fill="url(#shineGrad)" opacity="0.3"/>
  <rect x="150" y="78" width="14" height="14" rx="7" fill="url(#shineGrad)" opacity="0.3"/>

  <!-- Eyes (white sclera) -->
  <ellipse cx="82" cy="88" rx="11" ry="12" fill="white" opacity="0.95"/>
  <ellipse cx="118" cy="88" rx="11" ry="12" fill="white" opacity="0.95"/>

  <!-- Pupils -->
  <circle cx="84" cy="89" r="5.5" fill="#1e3a5f"/>
  <circle cx="120" cy="89" r="5.5" fill="#1e3a5f"/>

  <!-- Eye highlights -->
  <circle cx="87" cy="86" r="2.5" fill="white" opacity="0.9"/>
  <circle cx="123" cy="86" r="2.5" fill="white" opacity="0.9"/>
  <circle cx="82" cy="92" r="1.2" fill="white" opacity="0.5"/>
  <circle cx="118" cy="92" r="1.2" fill="white" opacity="0.5"/>

  <!-- Blush cheeks -->
  <ellipse cx="68" cy="98" rx="7" ry="4" fill="#f472b6" opacity="0.2"/>
  <ellipse cx="132" cy="98" rx="7" ry="4" fill="#f472b6" opacity="0.2"/>

  <!-- Smile -->
  <path d="M87 102 Q100 114 113 102" stroke="white" stroke-width="2.8" fill="none" stroke-linecap="round" opacity="0.9"/>

  <!-- Body -->
  <g filter="url(#softShadow)">
    <rect x="64" y="136" width="72" height="46" rx="18" fill="url(#bodyGrad)"/>
  </g>

  <!-- Body shine -->
  <rect x="64" y="136" width="72" height="22" rx="18" fill="url(#shineGrad)" opacity="0.3"/>

  <!-- Body screen/badge -->
  <rect x="82" y="148" width="36" height="20" rx="10" fill="#60a5fa" opacity="0.5"/>
  <circle cx="93" cy="158" r="3" fill="white" opacity="0.4"/>
  <circle cx="100" cy="158" r="3" fill="white" opacity="0.6"/>
  <circle cx="107" cy="158" r="3" fill="white" opacity="0.4"/>

  <!-- Arms -->
  <rect x="42" y="142" width="24" height="14" rx="7" fill="url(#bodyGrad)"/>
  <rect x="134" y="142" width="24" height="14" rx="7" fill="url(#bodyGrad)"/>

  <!-- Floating animation for the whole bot -->
  <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="4s" repeatCount="indefinite"/>
</svg>
